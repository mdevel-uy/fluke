services:
  vibe-kanban:
    image: vibe-kanban:local-dev
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RUST_LOG: info
      HOST: 0.0.0.0
      PORT: 3000
      # Fixed port so the preview/editor iframes can reach the proxy from the
      # host browser ({port}--{hostId}.localhost:3009).
      PREVIEW_PROXY_PORT: 3009
    ports:
      - "3000:3000"
      - "3009:3009"
    volumes:
      - vk-repos:/repos
      - vk-home:/home/appuser
    restart: unless-stopped

  # Log shipper for the fleet. Off by default; enable with
  #   docker compose --profile observability up -d
  # and provide the six env vars below (typically injected at provisioning
  # time from /root/vk-fleet-ingest.credentials on the observability VPS).
  # See docs/self-hosting/observability-logs.mdx for the runbook.
  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.4.3
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      VK_CLIENTE: ${VK_CLIENTE:?required when observability profile is active}
      VK_INSTANCIA: ${VK_INSTANCIA:?required when observability profile is active}
      VK_VERSION: ${VK_VERSION:?required when observability profile is active}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:?required when observability profile is active}
      LOKI_PUSH_USER: ${LOKI_PUSH_USER:?required when observability profile is active}
      LOKI_PUSH_PASSWORD: ${LOKI_PUSH_PASSWORD:?required when observability profile is active}
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vk-alloy-data:/var/lib/alloy/data

volumes:
  vk-repos:
  vk-home:
  vk-alloy-data:
