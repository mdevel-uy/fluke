name: Factory guards

# Checks deterministas sobre el diff del PR contra mdev.
# Corre en < 1 min: solo diff + ls, sin build ni tests.
#
# Reglas (ver scripts/factory-guards.sh para el detalle):
#   1. Diff toca shared/types.ts   => body del PR debe incluir [types-regen]
#   2. Diff toca Cargo.lock        => body del PR debe incluir [lockfile]
#   3. Migración nueva bajo crates/db/migrations/ => timestamp de 14 dígitos
#   4. Sin colisiones de timestamp entre migraciones
#   5. Sin nuevas instrucciones de gh-write en archivos de prompts (issue #549)
#
# TODO (fase 2, fuera del ticket #369): lint de strings visibles hardcodeados
# fuera de i18n.

on:
  # Manual por ahora (sin créditos de Actions); antes: pull_request a mdev.
  workflow_dispatch:
    inputs:
      pr:
        description: "Número del PR a chequear"
        required: true
        type: string

concurrency:
  group: factory-guards-${{ inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  factory-guards:
    name: Factory guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr }}" > "$RUNNER_TEMP/pr.json"
          echo "head=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          { echo 'body<<PR_BODY_EOF'; jq -r '.body // ""' "$RUNNER_TEMP/pr.json"; echo 'PR_BODY_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 asegura que la base del PR esté presente para el diff.
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head }}

      - name: Ensure base ref is fetched
        # Red de seguridad: si por algún motivo la base no está en el clon
        # (fetch-depth cambia en el futuro, force-push a la base, etc.),
        # traemos el commit explícitamente. Sin esta red el diff podría vaciarse
        # silenciosamente y el guard reportaría verde por error de setup.
        run: |
          set -e
          if ! git cat-file -e "${{ steps.pr.outputs.base }}^{commit}" 2>/dev/null; then
            echo "Base commit no presente en el checkout, haciendo fetch explícito..."
            git fetch --no-tags --depth=1 origin "${{ steps.pr.outputs.base }}"
          fi

      - name: Run factory guards
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: bash scripts/factory-guards.sh
