# Desktop release for mdevel (DESKTOP-SPEC.md FD2 + FD3, RD4-RD7).
#
# Targets:
#   - Windows x64: cargo-xwin + NSIS cross-compile from ubuntu (as upstream did)
#   - macOS arm64 + x64: native build on macos runners, .dmg
#
# macOS signing: if the APPLE_* secrets exist the app is signed with the
# Developer ID and notarized; otherwise it is ad-hoc signed (opens after
# "Open Anyway" in System Settings > Privacy & Security). Windows is unsigned.
#
# No auto-update: the repo is private, so the updater cannot fetch release
# assets anonymously. Org members download installers from desktop-v* releases.
# The updater plugin stays wired (UPDATE_ENDPOINT must be a valid URL for it
# to init); its checks just fail with a logged warning. To enable updates,
# publish latest.json somewhere public and point UPDATE_ENDPOINT there.
#
# Versioning (RD6): manual — the version input is patched into tauri.conf.json
# at CI time and becomes tag desktop-v<version>. No commit is created.

name: Desktop Release (mdevel)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0 (creates tag desktop-v<version>)"
        required: true
        type: string
      dry_run:
        description: "Build only — no tag, no release"
        required: false
        type: boolean
        default: false

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  RUST_TOOLCHAIN: nightly-2025-12-04
  CARGO_XWIN_VERSION: 0.20.2
  UPDATE_ENDPOINT: https://github.com/mdevel-uy/mkanban/releases/download/desktop-latest/latest.json

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: ubuntu-24.04
            target: x86_64-pc-windows-msvc
            arch: x64
          - platform: darwin-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - platform: darwin-x86_64
            os: macos-15
            target: x86_64-apple-darwin
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_HOME: ${{ github.workspace }}/.cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin-cache
    steps:
      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be X.Y.Z (got: ${{ inputs.version }})"
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            .cargo/registry/cache
            .cargo/registry/index
            .cargo/git/db
            .cargo/bin
            .cargo/.crates.toml
            .cargo/.crates2.json
          key: cargo-desktop-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-desktop-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ matrix.target }}-

      - name: Cache xwin downloads
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.xwin-cache
          key: xwin-desktop-${{ matrix.target }}-cargo-xwin-${{ env.CARGO_XWIN_VERSION }}

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install Windows cross-compilation dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            clang libclang-dev lld llvm nasm cmake ninja-build nsis

      - name: Install cargo-xwin
        if: runner.os == 'Linux'
        uses: taiki-e/cache-cargo-install-action@34ce5120836e5f9f1508d8713d7fdea0e8facd6f # v3.0.1
        with:
          tool: cargo-xwin
          git: https://github.com/rust-cross/cargo-xwin
          rev: 635a9559d49d719e79e0f60d92eb44447faf3212 # v0.20.2

      - name: Install Tauri CLI
        uses: taiki-e/cache-cargo-install-action@34ce5120836e5f9f1508d8713d7fdea0e8facd6f # v3.0.1
        with:
          tool: tauri-cli@2

      - name: Install dependencies
        run: pnpm install

      # No Sentry/PostHog/shared-API env on purpose: telemetry stays off and
      # the app is local-only (DESKTOP-SPEC.md decision 5, RD5/RD8).
      - name: Build frontend
        run: cd packages/local-web && npm run build

      - name: Patch tauri.conf.json (version + updater endpoint)
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('crates/tauri-app/tauri.conf.json', 'utf8'));
            conf.version = '${{ inputs.version }}';
            conf.plugins.updater.endpoints = conf.plugins.updater.endpoints.map(e =>
              e === '__TAURI_UPDATE_ENDPOINT__' ? '${{ env.UPDATE_ENDPOINT }}' : e
            );
            fs.writeFileSync('crates/tauri-app/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          git diff --stat crates/tauri-app/tauri.conf.json

      # Developer ID signing + notarization only when the secrets exist;
      # otherwise ad-hoc signing ("-") so the bundle signature stays valid.
      - name: Set up Apple signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate: ad-hoc signing, no notarization"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$API_KEY_ID" ]; then
            mkdir -p ~/.private_keys
            KEY_PATH="$HOME/.private_keys/AuthKey_${API_KEY_ID}.p8"
            printf '%s' "$API_PRIVATE_KEY" > "$KEY_PATH"
            {
              echo "APPLE_API_KEY=$API_KEY_ID"
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY_PATH=$KEY_PATH"
            } >> "$GITHUB_ENV"
          fi

      - name: Build Tauri app
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo tauri build --runner cargo-xwin --target ${{ matrix.target }} --bundles nsis --ci
          else
            cargo tauri build --target ${{ matrix.target }} --bundles app,dmg --ci
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # GitHub release assets are flat and normalize spaces: stable names.
      - name: Collect installer
        run: |
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            SRC=$(find "$BUNDLE" -name "*-setup.exe" | head -1); EXT="-setup.exe"
          else
            SRC=$(find "$BUNDLE" -name "*.dmg" | head -1); EXT=".dmg"
          fi
          if [ -z "$SRC" ]; then
            echo "No installer in $BUNDLE"; find "$BUNDLE" -maxdepth 2; exit 1
          fi
          mkdir -p dist-release
          cp "$SRC" "dist-release/mkanban_${{ inputs.version }}_${{ matrix.arch }}${EXT}"
          ls -la dist-release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-release/
          retention-days: 7

  release:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: dist-release
          merge-multiple: true

      - name: Create release desktop-v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="${{ inputs.version }}"
          cat > notes.md <<'EOF'
          Instalación:
          - Windows x64: `mkanban_*_x64-setup.exe` (sin firma: en SmartScreen elegir "Más información" > "Ejecutar de todas formas").
          - macOS Apple Silicon: `mkanban_*_aarch64.dmg`. macOS Intel: `mkanban_*_x64.dmg`.
            Si macOS indica que no puede verificar la app: Configuración del Sistema > Privacidad y seguridad > "Abrir igualmente".

          Sin auto-update: para actualizar, bajar el instalador de la versión nueva e instalar encima.
          EOF
          gh release create "desktop-v$V" \
            --target "${{ github.sha }}" \
            --title "mkanban Desktop v$V" \
            --notes-file notes.md \
            dist-release/*
