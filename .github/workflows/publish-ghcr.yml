name: publish-ghcr

# Publishes the on-prem docker image to GHCR when the version in package.json
# is bumped on main. Tags pushed:
#   - <X.Y.Z>  immutable release tag (never overwritten — the check job skips
#              the build entirely if the tag already exists in GHCR)
#   - stable   moving channel tag; client updaters pull this one
#
# Clients pull with a read-only token (classic PAT, read:packages scope).
# Revoking that token cuts the client off from updates.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

permissions:
  contents: write # crear el tag de git vX.Y.Z tras publicar
  packages: write

# Rebrand mkanban -> Fluke (#581): la imagen se publica con los dos nombres
# durante una release de transición, para que los clientes on-prem con
# FK_IMAGE=ghcr.io/mdevel-uy/mkanban sigan recibiendo updates mientras migran.
# Pasada esa release, borrar IMAGE_LEGACY y sus tags.
env:
  IMAGE: ghcr.io/mdevel-uy/fluke
  IMAGE_LEGACY: ghcr.io/mdevel-uy/mkanban

jobs:
  version:
    name: Detect version bump
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: ver
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version is already published
        id: check
        # Mientras exista IMAGE_LEGACY se mira también el package viejo: sin
        # eso, el primer run tras el rename ve `fluke` vacío y re-publica una
        # versión ya publicada sobre mkanban:X.Y.Z y mkanban:stable.
        run: |
          V="${{ steps.ver.outputs.version }}"
          if docker manifest inspect "$IMAGE:$V" >/dev/null 2>&1 \
            || docker manifest inspect "$IMAGE_LEGACY:$V" >/dev/null 2>&1; then
            echo "Version ${{ steps.ver.outputs.version }} already in GHCR — skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build & push image
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The release cargo build needs more disk than the runner has free by
      # default; drop the preinstalled toolchains we never use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:stable
            ${{ env.IMAGE_LEGACY }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_LEGACY }}:stable
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag de git que apunta al commit exacto que produjo la imagen. Con esto,
      # ante un bug reportado por un cliente en la vX.Y.Z, `git checkout vX.Y.Z`
      # reproduce lo que tiene instalado. La imagen ya lleva el SHA en el label
      # org.opencontainers.image.revision; el tag lo hace navegable.
      # Idempotente: si el tag ya existe (re-corrida manual), no falla.
      - name: Tag git release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "El tag v${VERSION} ya existe — no se recrea."
            exit 0
          fi
          git tag -a "v${VERSION}" -m "fluke ${VERSION}"
          git push origin "v${VERSION}"
