[package]
name = "fluke-console"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Fluke terminal workspace"

# Keep this experiment independent of Fluke's existing application workspace.
[workspace]

[dependencies]
crossterm = "0.28.1"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
portable-pty = "0.9.0"
vt100 = "0.15.2"
vte = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
fs2 = "0.4.3"
dunce = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
