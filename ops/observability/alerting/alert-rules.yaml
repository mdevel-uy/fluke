# Grafana Alerting — reglas de la flota fluke.
#
# Este archivo es idempotente por `uid`: reprovisionar sólo actualiza las
# reglas existentes con estos UIDs (no borra alertas de otros proyectos que
# compartan el stack).
#
# Todas las reglas etiquetan `proyecto: fluke` para que la notification
# policy del stack pueda enrutarlas al contact point de los socios sin tocar
# alertas de otros proyectos (ver `README.md`).
#
# Los datasourceUid `prometheus` y `loki` son los defaults del stack central
# — si tu Grafana usa otros UIDs, ajustalos aquí antes de aplicar (una vez).
apiVersion: 1

groups:
  - orgId: 1
    name: fluke-fleet
    folder: fluke
    interval: 1m
    rules:
      # -------------------------------------------------------------------
      # 1) Instancia sin reportar métricas en los últimos 5 minutos.
      #
      # Alloy scrapea /api/metrics cada 30s y hace remote_write al Prometheus
      # central; 5 minutos sin muestras es indicativo de:
      #   - contenedor fluke caído
      #   - Alloy caído
      #   - red de la instancia rota (VPN del cliente)
      #
      # Se etiqueta cada alerta con (cliente, instancia) para que la
      # notificación identifique la instancia afectada.
      #
      # `last_over_time([15m:30s])` extiende la ventana efectiva de lookup a
      # 15 min, por encima del default de Prometheus (5m), para que la resta
      # de timestamps siga dando un valor útil aunque el último sample ya
      # esté por fuera del lookback estándar.
      # -------------------------------------------------------------------
      - uid: vk-instance-not-reporting
        title: 'instancia fluke sin reportar métricas'
        condition: threshold
        for: 0m
        # KeepLastState: si el silencio dura tanto que Prometheus borra la
        # serie por retención (~15 min sin muestras con nuestro subquery), la
        # query devuelve vacío; queremos que la alerta siga firing en vez de
        # resolverse sola. Cuando la instancia vuelva y Alloy pushee, la
        # serie reaparece con staleness bajo y la alerta resuelve normal.
        noDataState: KeepLastState
        execErrState: Error
        isPaused: false
        data:
          - refId: query
            queryType: ''
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: query
              editorMode: code
              instant: true
              range: false
              exemplar: false
              expr: |
                time() - max by (cliente, instancia) (
                  last_over_time(timestamp(fluke_build_info{proyecto="fluke"})[15m:30s])
                )
              intervalMs: 30000
              maxDataPoints: 43200
              legendFormat: __auto
          - refId: threshold
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: query
              conditions:
                - evaluator:
                    type: gt
                    params: [300]
                  operator:
                    type: and
                  reducer:
                    type: last
                    params: []
                  type: query
        labels:
          proyecto: fluke
          severity: critical
          categoria: disponibilidad
        annotations:
          summary: '{{ $labels.cliente }}/{{ $labels.instancia }} sin métricas hace {{ humanizeDuration $values.query.Value }}'
          description: |
            La instancia {{ $labels.cliente }}/{{ $labels.instancia }} no reporta
            métricas al Prometheus central desde hace más de 5 minutos. Alloy
            scrapea /api/metrics cada 30s, así que este silencio es real.
          runbook: |
            1. Mirar el estado del contenedor en la VPN del cliente:
                 docker compose -f docker-compose.local.yml ps
               Si `fluke` o `alloy` no están `Up`, ver logs con `docker compose logs --tail=200 <servicio>`.
            2. Si los contenedores están arriba, probar `curl -sf http://fluke:3000/api/metrics | head` dentro del contenedor `alloy` — un 5xx apunta a un stall del backend.
            3. Si la app responde pero Alloy no pushea, revisar logs de `alloy` buscando `401 Unauthorized`, `context deadline exceeded` o errores TLS contra `PROM_PUSH_URL`.
            4. Si la instancia está sana pero el Prometheus central no ve muestras: verificar en Grafana el datasource `prometheus` y consultar directamente {{`{proyecto="fluke", instancia="X"}`}}.

      # -------------------------------------------------------------------
      # 2) Disco del volumen de repos por encima del 80%.
      #
      # Los clones que agentes de código hacen sobre `/repos` son el consumo
      # de disco que crece de forma no acotada; sin margen, los executors
      # empiezan a fallar por `No space left on device`.
      #
      # La query toma el `max` de "used ratio" sobre todos los mounts de
      # node-exporter (excluyendo pseudo-fs) por (cliente, instancia). Así
      # cualquier mount de la instancia por encima del umbral dispara la
      # alerta con las labels de la instancia, sin necesidad de saber cuál
      # es el mountpoint exacto de `/repos` en cada host.
      # -------------------------------------------------------------------
      - uid: vk-disk-repos-high
        title: 'Disco de instancia fluke por encima del 80%'
        condition: threshold
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: query
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: query
              editorMode: code
              instant: true
              range: false
              exemplar: false
              expr: |
                max by (cliente, instancia) (
                  1 - (
                    node_filesystem_avail_bytes{proyecto="fluke", fstype!~"tmpfs|overlay|squashfs|devtmpfs"}
                    /
                    node_filesystem_size_bytes{proyecto="fluke", fstype!~"tmpfs|overlay|squashfs|devtmpfs"}
                  )
                )
              intervalMs: 30000
              maxDataPoints: 43200
              legendFormat: __auto
          - refId: threshold
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: query
              conditions:
                - evaluator:
                    type: gt
                    params: [0.80]
                  operator:
                    type: and
                  reducer:
                    type: last
                    params: []
                  type: query
        labels:
          proyecto: fluke
          severity: warning
          categoria: capacidad
        annotations:
          summary: '{{ $labels.cliente }}/{{ $labels.instancia }} con disco al {{ printf "%.0f" (mult $values.query.Value 100.0) }}%'
          description: |
            Al menos un filesystem no efímero de {{ $labels.cliente }}/{{ $labels.instancia }}
            supera el 80% de uso durante los últimos 5 minutos. El volumen que
            respalda `/repos` es el sospechoso más probable — los clones de
            agentes de código lo llenan sin límite.
          runbook: |
            1. SSH a la instancia y correr `df -h` — identificar el mount lleno (típicamente el del volumen de `/repos`).
            2. Ver el tamaño del árbol de repos: `du -sh /var/lib/docker/volumes/*/_data/repos/*` (ajustar path al volumen real).
            3. Vaciar workspaces sin uso reciente: en la UI de fluke, borrar workspaces obsoletos o purgar clones huérfanos con la herramienta interna.
            4. Si el mount lleno NO es el de `/repos` (p.ej. `/var/log` o `/`), investigar allí antes de tocar volúmenes de datos.
            5. Considerar redimensionar el volumen si el uso legítimo crece más rápido que la limpieza.

      # -------------------------------------------------------------------
      # 3) Tasa de errores de executors sostenida.
      #
      # `fluke_execution_processes_failed_total` es un counter que crece
      # cada vez que un execution process termina en `failed`. Un pico puntual
      # (retry de red, agente que aborta) es normal; una tasa sostenida por
      # más de 10 minutos indica una falla sistémica: credenciales rotas de un
      # coding agent, cuota agotada del proveedor, o corrupción en la DB.
      #
      # Umbral: >2 fallos por minuto sostenido durante 10 minutos.
      # -------------------------------------------------------------------
      - uid: vk-executor-error-rate
        title: 'Tasa de errores de executor sostenida en fluke'
        condition: threshold
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: query
            queryType: ''
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: query
              editorMode: code
              instant: true
              range: false
              exemplar: false
              expr: |
                sum by (cliente, instancia) (
                  rate(fluke_execution_processes_failed_total{proyecto="fluke"}[10m])
                ) * 60
              intervalMs: 30000
              maxDataPoints: 43200
              legendFormat: __auto
          - refId: threshold
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: query
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
                  operator:
                    type: and
                  reducer:
                    type: last
                    params: []
                  type: query
        labels:
          proyecto: fluke
          severity: warning
          categoria: errores
        annotations:
          summary: '{{ $labels.cliente }}/{{ $labels.instancia }} con {{ printf "%.1f" $values.query.Value }} fallos/min de executor'
          description: |
            La tasa de fallos de execution processes en
            {{ $labels.cliente }}/{{ $labels.instancia }} supera los 2 por
            minuto durante los últimos 10 minutos. Un pico puntual es normal;
            una tasa sostenida sugiere causa sistémica.
          runbook: |
            1. Abrir el dashboard `fluke-cliente` para la instancia afectada — el panel "Errores executor por instancia" muestra el desglose por `run_reason` (`codingagent`, `setupscript`, …), que dice qué se está rompiendo.
            2. Filtrar logs en Loki: {{`{proyecto="fluke", cliente="X", instancia="Y"} |~ "(?i)error"`}} en el rango de los últimos 15 min.
            3. Causas comunes por `run_reason`:
                 - `codingagent`: credenciales/cuota del proveedor del agente (Anthropic/OpenAI/etc.) o límite de tokens.
                 - `setupscript`: script de setup del proyecto roto (dependencia rota, permisos).
                 - `cleanupscript`: workspace corrupto, ver logs del script en el mismo proceso.
            4. Si toda la flota entra a esta alerta simultáneamente, buscar una incidencia externa (proveedor del agente caído, GitHub down) antes de tocar código.
