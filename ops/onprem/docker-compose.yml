# Bundle on-premises de mkanban (mkanban.dev).
#
# Este archivo es GENÉRICO e idéntico en todos los clientes — nunca se edita
# en el host. Toda la configuración por-cliente vive en el `.env` de al lado
# (ver .env.example). Los updates OTA (update.sh) hacen pull de la imagen y
# `up -d`; ni este archivo ni el .env se tocan.
#
# La imagen no contiene código fuente: es el binario `server` (Rust, release)
# con el frontend embebido. Las migraciones de DB corren solas al arranque.

services:
  mkanban:
    image: ${MK_IMAGE:-ghcr.io/mdevel-uy/mkanban}:${MK_CHANNEL:-stable}
    # Nombre fijo: update.sh lo usa para inspeccionar imagen corriente y health.
    container_name: mkanban
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HOST: 0.0.0.0
      PORT: 3000
      # Puerto fijo para que los iframes de preview/editor lleguen al proxy
      # desde el browser del host ({port}--{hostId}.localhost:3009).
      PREVIEW_PROXY_PORT: 3009
      # Cap de agentes concurrentes según el plan contratado. Vacío = default
      # de la app (el parse fallido cae al default, no rompe el arranque).
      WORKER_MAX_IN_REVIEW: ${WORKER_MAX_IN_REVIEW:-}
      PLAN_UPGRADE_CTA_URL: ${PLAN_UPGRADE_CTA_URL:-}
      PLAN_UPGRADE_CTA_LABEL: ${PLAN_UPGRADE_CTA_LABEL:-}
      MK_ALLOWED_ORIGINS: ${MK_ALLOWED_ORIGINS:-}
      # Heartbeat al control plane de tetherpad (licencia + métricas de
      # facturación). Vacío = no reporta (opt-in). El token de enrolamiento
      # auto-vincula la instancia al contrato del cliente.
      TETHERPAD_CONTROL_PLANE_URL: ${TETHERPAD_CONTROL_PLANE_URL:-}
      TETHERPAD_ENROLL_TOKEN: ${TETHERPAD_ENROLL_TOKEN:-}
    # Bind por defecto a loopback: el patrón esperado es un reverse proxy
    # (Traefik/Caddy/Nginx) del host que termina TLS y hace forward acá.
    # Para exponer directo en la interfaz pública (sin proxy), sobreescribir
    # `MK_BIND_ADDR=0.0.0.0` en el `.env` — decisión consciente porque Docker
    # publica por iptables y bypassea ufw.
    ports:
      - "${MK_BIND_ADDR:-127.0.0.1}:${MK_PORT:-3000}:3000"
      - "${MK_BIND_ADDR:-127.0.0.1}:${MK_PREVIEW_PORT:-3009}:3009"
    volumes:
      - mk-repos:/repos
      - mk-home:/home/appuser
    restart: unless-stopped

volumes:
  # Nombres explícitos: así update.sh puede montarlos para backup/restore sin
  # depender del nombre del directorio del proyecto compose.
  mk-repos:
    name: mk-repos
  mk-home:
    name: mk-home

# Definición de producto para tetherpad (ADR 0004 de tetherpad: el compose del
# producto, anotado — sin DSL propio). Declara qué se mide y qué entitlements
# existen; la implementación de cada contador vive en la app (services::usage).
x-tetherpad:
  product: mkanban
  metering:
    # Tickets que llegaron a done con completed_at (acumulativo desde siempre;
    # el corte mensual lo deriva el control plane restando snapshots). Misma
    # fuente que el panel de "valor generado": una sola base de facturación.
    - key: tickets_done_total
  entitlements:
    # Cap de agentes concurrentes según plan (hoy aplicado vía
    # WORKER_MAX_IN_REVIEW; pasará a leerse de la licencia).
    - key: max_workers
