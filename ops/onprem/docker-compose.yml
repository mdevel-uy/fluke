# Bundle on-premises de Fluke.
#
# Este archivo es GENÉRICO e idéntico en todos los clientes — nunca se edita
# en el host. Toda la configuración por-cliente vive en el `.env` de al lado
# (ver .env.example). Los updates OTA (update.sh) hacen pull de la imagen y
# `up -d`; ni este archivo ni el .env se tocan.
#
# La imagen no contiene código fuente: es el binario `server` (Rust, release)
# con el frontend embebido. Las migraciones de DB corren solas al arranque.

# Variables `FK_*`: las `MK_*` equivalentes siguen valiendo como fallback
# (compat con `.env` previos al rebrand; ver RUNBOOK → Migración a Fluke).

services:
  fluke:
    image: ${FK_IMAGE:-${MK_IMAGE:-ghcr.io/mdevel-uy/fluke}}:${FK_CHANNEL:-${MK_CHANNEL:-stable}}
    # Nombre fijo: update.sh lo usa para inspeccionar imagen corriente y health.
    container_name: fluke
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HOST: 0.0.0.0
      PORT: 3000
      # Puerto fijo para que los iframes de preview/editor lleguen al proxy
      # desde el browser del host ({port}--{hostId}.localhost:3009).
      PREVIEW_PROXY_PORT: 3009
      # Cap de agentes concurrentes según el plan contratado. Vacío = default
      # de la app (el parse fallido cae al default, no rompe el arranque).
      WORKER_MAX_IN_REVIEW: ${WORKER_MAX_IN_REVIEW:-}
      PLAN_UPGRADE_CTA_URL: ${PLAN_UPGRADE_CTA_URL:-}
      PLAN_UPGRADE_CTA_LABEL: ${PLAN_UPGRADE_CTA_LABEL:-}
      FK_ALLOWED_ORIGINS: ${FK_ALLOWED_ORIGINS:-${MK_ALLOWED_ORIGINS:-}}
      # Heartbeat al control plane de mdevel (licencia + métricas de
      # facturación). Vacío = no reporta (opt-in). El token auto-vincula la
      # instancia al cliente en el panel de control.
      MKANBAN_CONTROL_PLANE_URL: ${MKANBAN_CONTROL_PLANE_URL:-}
      MKANBAN_INGEST_TOKEN: ${MKANBAN_INGEST_TOKEN:-}
    # Bind por defecto a loopback: el patrón esperado es un reverse proxy
    # (Traefik/Caddy/Nginx) del host que termina TLS y hace forward acá.
    # Para exponer directo en la interfaz pública (sin proxy), sobreescribir
    # `FK_BIND_ADDR=0.0.0.0` en el `.env` — decisión consciente porque Docker
    # publica por iptables y bypassea ufw.
    ports:
      - "${FK_BIND_ADDR:-${MK_BIND_ADDR:-127.0.0.1}}:${FK_PORT:-${MK_PORT:-3000}}:3000"
      - "${FK_BIND_ADDR:-${MK_BIND_ADDR:-127.0.0.1}}:${FK_PREVIEW_PORT:-${MK_PREVIEW_PORT:-3009}}:3009"
    volumes:
      - fk-repos:/repos
      - fk-home:/home/appuser
    restart: unless-stopped

volumes:
  # Nombres explícitos: así update.sh puede montarlos para backup/restore sin
  # depender del nombre del directorio del proyecto compose.
  fk-repos:
    name: fk-repos
  fk-home:
    name: fk-home
