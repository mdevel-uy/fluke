[workspace]
resolver = "3"
members = [
    "crates/api-types",
    "crates/relay-client",
    "crates/server",
    "crates/relay-types",
    "crates/trusted-key-auth",
    "crates/mcp",
    "crates/db",
    "crates/executors",
    "crates/services",
    "crates/worktree-manager",
    "crates/workspace-manager",
    "crates/relay-control",
    "crates/relay-protocol",
    "crates/relay-ws",
    "crates/ws-bridge",
    "crates/relay-hosts",
    "crates/client-info",
    "crates/remote-info",
    "crates/utils",
    "crates/licensing",
    "crates/fluke-license",
    "crates/heartbeat-protocol",
    "crates/license-keystore",
    "crates/git",
    "crates/git-host",
    "crates/local-deployment",
    "crates/deployment",
    "crates/review",
    "crates/embedded-ssh",
    "crates/desktop-bridge",
    "crates/tauri-app",
    "crates/preview-proxy",
    "crates/relay-tunnel-core",
    "crates/relay-webrtc",
]
exclude = ["crates/remote", "crates/relay-tunnel"]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.8.4", features = ["macros", "multipart", "ws"] }
tower-http = { version = "0.5", features = ["cors", "request-id", "trace", "fs", "validate-request", "compression-gzip", "compression-br"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
git2 = { version = "0.20.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
thiserror = "2.0.12"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ts-rs = { git = "https://github.com/xazukx/ts-rs.git", branch = "use-ts-enum", features = ["uuid-impl", "chrono-impl", "no-serde-warnings", "serde-json-impl"] }
schemars = { version = "1.0.4", features = ["derive", "chrono04", "uuid1", "preserve_order"] }
serde_with = "3"
async-trait = "0.1"
aws-lc-sys = ">=0.37.0"
aws-lc-rs = "1.18"

[profile.release]
debug = 1
split-debuginfo = "packed"
strip = true

# codex-app-server-protocol depends on OpenAI's tungstenite forks (`proxy`
# feature); mirror the codex workspace patches. Bump with the codex tag.
# starlark: fork of 0.14.2 that does not enable serde_json/arbitrary_precision
# (it unifies across the whole build and breaks f64 decoding inside
# serde-buffered enums). Bump the rev when the codex tag changes the starlark version.
[patch.crates-io]
starlark = { git = "https://github.com/mdevel-uy/starlark-rust", rev = "05e4cd893381b47a71d21103b700519ac399fe62" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
