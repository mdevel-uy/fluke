<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fluke escuchando</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0C121F}
a{color:#818CF8}a:hover{color:#A5B4FC}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.lbl{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#A6ACB8}
.ibtn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;border-radius:6px;background:transparent;color:#A6ACB8;cursor:pointer}
.ibtn:hover{color:#F8FAFC;background:#232B3E}
.ctl{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid #373F53;background:#101523;color:#D6DAE1;cursor:pointer}
.ctl:hover{border-color:#818CF8;color:#F8FAFC}
.core{position:relative;border-radius:50%}
.ring{position:absolute;border-radius:50%;box-sizing:border-box}
.r-ticks{inset:0;background:repeating-conic-gradient(#4A5268 0 .6deg,transparent .6deg 3.5deg);-webkit-mask:radial-gradient(circle,transparent 66%,#000 66.5%,#000 70%,transparent 70.5%);mask:radial-gradient(circle,transparent 66%,#000 66.5%,#000 70%,transparent 70.5%)}
.r-dash{inset:6%;border:1px dashed #373F53;animation:spin 90s linear infinite}
.r-arc{inset:12%;border:2px solid transparent;border-top-color:#818CF8;border-left-color:rgba(129,140,248,.35);animation:spin 5s linear infinite}
.r-arc2{inset:18%;border:1px solid transparent;border-bottom-color:#6366F1;border-right-color:#6366F1;animation:spin 9s linear infinite reverse}
.r-pulse{inset:26%;border:1px solid #818CF8;animation:pulse 1.8s ease-out infinite}
.r-inner{inset:28%;border:1px solid #373F53;background:radial-gradient(circle,#1E2550 0%,#131A30 55%,#101523 100%);box-shadow:0 0 48px rgba(99,102,241,.3),inset 0 0 32px rgba(99,102,241,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#C7D2FE}
.glow{filter:drop-shadow(0 0 8px rgba(129,140,248,.8))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.wave span{display:block;width:3px;border-radius:999px;background:#818CF8;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.3);opacity:.5}50%{transform:scaleY(1);opacity:1}}
.caret{display:inline-block;width:2px;height:1em;background:#818CF8;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chip{border:1px solid #373F53;background:#161D2C;color:#D6DAE1;border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer;font-family:inherit;min-height:36px}
.chip:hover{border-color:#818CF8;color:#F8FAFC}
.said{color:#F8FAFC}.unsaid{color:#4A5268}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 380px; height: 640px; box-sizing: border-box; display: flex; flex-direction: column; background-color: #0C121F; background-image: linear-gradient(rgba(55,63,83,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(55,63,83,.18) 1px,transparent 1px); background-size: 40px 40px; border: 1px solid #373F53; border-radius: 14px; overflow: hidden; color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; box-shadow: 0 20px 48px rgba(0,0,0,.5)">
  <header style="display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px">
    <span style="color: #818CF8; display: flex"><svg viewBox="0 0 100 100" width="14" height="14" aria-hidden="true"><path d="M50,86 C26,77 6,53 4,21 C3,12 11,10 19,18 C36,36 47,57 50,70 C53,57 64,36 81,18 C89,10 97,12 96,21 C94,53 74,77 50,86 Z" fill="currentColor"></path></svg></span>
    <span class="mono" style="font-size: 12px; letter-spacing: .3em; font-weight: 600">FLUKE</span>
    <span class="mono" style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid #373F53; border-radius: 999px; font-size: 10px; letter-spacing: .16em; color: #C7D2FE; background: #131A30"><span style="width: 6px; height: 6px; border-radius: 50%; background: #818CF8; box-shadow: 0 0 8px #818CF8"></span>ESCUCHANDO</span>
    <div style="margin-left: auto; display: flex; gap: 2px">
      <button class="ibtn" type="button" aria-label="Transcripción"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9h8M8 12h5"></path></svg></button>
      <button class="ibtn" type="button" aria-label="Expandir"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"></path></svg></button>
      <button class="ibtn" type="button" aria-label="Minimizar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
    </div>
  </header>
  <div style="margin: 0 16px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid #232B3E; border-radius: 12px; background: rgba(16,21,35,.85)">
    <span class="lbl">Misión</span><span style="font-size: 12px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Login con GitHub</span>
    <span style="display: flex; gap: 2px" title="Fase Brief"><span style="width: 14px; height: 3px; border-radius: 999px; background: #818CF8"></span><span style="width: 14px; height: 3px; border-radius: 999px; background: #373F53"></span><span style="width: 14px; height: 3px; border-radius: 999px; background: #373F53"></span><span style="width: 14px; height: 3px; border-radius: 999px; background: #373F53"></span></span>
    <span class="lbl" style="color: #C7D2FE">Brief 4/6</span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 8px 20px">
    <div class="core" style="width: 220px; height: 220px">
      <div class="ring r-ticks"></div><div class="ring r-dash"></div><div class="ring r-arc"></div><div class="ring r-arc2"></div><div class="ring r-pulse"></div>
      <div class="ring r-inner"><span class="glow" style="display: flex"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></span></div>
    </div>
    <span class="mono" style="font-size: 10px; letter-spacing: .3em; color: #C7D2FE">ESCUCHANDO</span>
    <p style="margin: 0; text-align: center; font-size: 18px; line-height: 1.4; font-weight: 500">Que sea opcional, con un botón en la pantalla de inicio<span class="caret"></span></p>
    <div class="wave" aria-hidden="true" style="display: flex; align-items: center; gap: 3px; height: 28px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="30"><span style="height: {{b.h}}px; animation-delay: {{b.d}}s"></span></sc-for>
    </div>
  </div>
  <div style="margin: 0 16px; padding: 12px 14px; border: 1px solid rgba(251,191,36,.35); border-radius: 12px; background: rgba(16,21,35,.9); display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between"><span class="lbl" style="color: #FBBF24">Fluke preguntó</span><span class="lbl">09:40</span></div>
    <span style="font-size: 13px; color: #D6DAE1; line-height: 1.45">¿El login es obligatorio al abrir la app o se puede omitir?</span>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 28px 10px">
    <button class="ctl" type="button" aria-label="Cambiar a texto"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h1M11 10h1M15 10h1M8 14h8"></path></svg></button>
    <button type="button" aria-label="Detener y enviar" style="width: 76px; height: 76px; border-radius: 50%; border: none; background: #C7D2FE; color: #0C121F; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 6px rgba(129,140,248,.18), 0 0 32px rgba(129,140,248,.5)"><span style="width: 20px; height: 20px; border-radius: 4px; background: #0C121F"></span></button>
    <button class="ctl" type="button" aria-label="Cancelar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>
  <p class="lbl" style="margin: 0 0 16px; text-align: center; text-transform: none; letter-spacing: .04em">Toque de nuevo para enviar · Esc cancela</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    var hs = [6,12,20,26,16,10,22,28,14,8,12,24,18,10,16,28,20,12,8,14,22,16,10,18,26,12,8,14,20,10];
    return { bars: hs.map(function (h, i) { return { h: h, d: ((i * 0.09) % 1.1).toFixed(2) }; }) };
  }
}
</script>
</body>
</html>
