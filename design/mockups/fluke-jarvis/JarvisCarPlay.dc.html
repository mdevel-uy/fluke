<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fluke Jarvis · CarPlay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#09090B}
a{color:#818CF8}a:hover{color:#A5B4FC}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.lbl{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#A1A1AA}
.core{position:relative;border-radius:50%}
.ring{position:absolute;border-radius:50%;box-sizing:border-box}
.r-ticks{inset:0;background:repeating-conic-gradient(#52525B 0 .6deg,transparent .6deg 3.5deg);-webkit-mask:radial-gradient(circle,transparent 68%,#000 68.5%,#000 72%,transparent 72.5%);mask:radial-gradient(circle,transparent 68%,#000 68.5%,#000 72%,transparent 72.5%)}
.r-arc{inset:12%;border:3px solid transparent;border-top-color:#818CF8;border-left-color:rgba(129,140,248,.3);animation:spin 5s linear infinite}
.r-arc2{inset:20%;border:2px solid transparent;border-bottom-color:#6366F1;border-right-color:#6366F1;animation:spin 9s linear infinite reverse}
.r-inner{inset:30%;border:1px solid #3F3F46;background:radial-gradient(circle,#1E1B4B 0%,#18181B 58%,#101012 100%);box-shadow:0 0 70px rgba(99,102,241,.4);display:flex;align-items:center;justify-content:center;color:#C7D2FE}
.glow{filter:drop-shadow(0 0 10px rgba(129,140,248,.9))}
@keyframes spin{to{transform:rotate(360deg)}}
.wave span{display:block;width:4px;background:#818CF8;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.3);opacity:.5}50%{transform:scaleY(1);opacity:1}}
.big{height:72px;min-width:200px;padding:0 28px;border:1px solid #52525B;background:rgba(24,24,27,.9);color:#FAFAFA;font-size:22px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px}
.big.brand{background:#6366F1;border-color:#6366F1;color:#FFFFFF}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 800px; height: 480px; box-sizing: border-box; display: flex; background-color: #09090B; background-image: radial-gradient(ellipse at 38% 50%, rgba(99,102,241,.22), transparent 50%); color: #FAFAFA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; border: 1px solid #3F3F46">
  <div style="width: 84px; border-right: 1px solid #27272A; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 18px; background: rgba(24,24,27,.6)">
    <span class="mono" style="font-size: 14px">9:41</span>
    <span style="width: 44px; height: 44px; border: 1px solid #3F3F46; display: flex; align-items: center; justify-content: center; color: #A1A1AA"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg></span>
    <span style="width: 44px; height: 44px; border: 1px solid #818CF8; background: #312E81; display: flex; align-items: center; justify-content: center; color: #C7D2FE"><svg viewBox="0 0 100 100" width="20" height="20" aria-hidden="true"><path d="M50,86 C26,77 6,53 4,21 C3,12 11,10 19,18 C36,36 47,57 50,70 C53,57 64,36 81,18 C89,10 97,12 96,21 C94,53 74,77 50,86 Z" fill="currentColor"></path></svg></span>
  </div>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 56px; padding: 0 40px">
    <div class="core" style="width: 300px; height: 300px; flex-shrink: 0">
      <div class="ring r-ticks"></div><div class="ring r-arc"></div><div class="ring r-arc2"></div>
      <div class="ring r-inner"><svg class="glow" viewBox="0 0 100 100" width="56" height="56" aria-hidden="true"><path d="M50,86 C26,77 6,53 4,21 C3,12 11,10 19,18 C36,36 47,57 50,70 C53,57 64,36 81,18 C89,10 97,12 96,21 C94,53 74,77 50,86 Z" fill="#818CF8"></path></svg></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 22px; min-width: 0">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span class="mono" style="font-size: 14px; letter-spacing: .3em; font-weight: 600">FLUKE</span>
        <span class="lbl" style="color: #C7D2FE; display: inline-flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #818CF8; box-shadow: 0 0 8px #818CF8"></span>Hablando</span>
      </div>
      <div class="wave" aria-hidden="true" style="display: flex; align-items: center; gap: 5px; height: 40px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="12"><span style="height: {{b.h}}px; animation-delay: {{b.d}}s"></span></sc-for></div>
      <button class="big brand" type="button" aria-label="Hablar con Fluke"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Hablar</button>
      <button class="big" type="button" aria-label="Terminar">Terminar</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    var hs = [10,22,34,18,28,40,16,30,24,12,36,20];
    return { bars: hs.map(function (h, i) { return { h: h, d: ((i * 0.09) % 1.1).toFixed(2) }; }) };
  }
}
</script>
</body>
</html>
