<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan milestone actions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#161b26}
a{color:#a5a8ff}a:hover{color:#c7c9ff}
.band{border:1px solid #343a4c;border-radius:10px;overflow:visible;background:#121722}
.band.warn{border-color:rgba(245,197,66,.45)}
.band.dragging{opacity:.4}
.band.over{box-shadow:0 -3px 0 0 #7c7ff0}
.grip{display:grid;place-items:center;width:14px;height:28px;margin:0 -8px 0 -6px;color:#5d6578;cursor:grab;flex:none}
.head:hover .grip{color:#aab2c5}
.star{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:#7d8599;fill:none;cursor:pointer;flex:none;padding:0;margin-left:-8px}
.star:hover{color:#f5c542;background:rgba(255,255,255,.06)}
.star.on{color:#f5c542;fill:#f5c542}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 16px;background:#252a39;border-radius:10px 10px 0 0;border-bottom:1px solid #343a4c;position:relative}
.icbtn{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:#aab2c5;cursor:pointer;flex:none;padding:0}
.icbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.icbtn.on{background:rgba(124,127,240,.18);color:#fff;outline:1px solid #7c7ff0}
.play{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid #7c7ff0;color:#7c7ff0;background:transparent;flex:none;padding:0;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border:1px solid #3d4457;border-radius:10px;font-size:11px;font-weight:500;color:#cfd5e2;background:#1b2030;white-space:nowrap}
.chip i{display:block;width:7px;height:7px;border-radius:50%}
.chip.pri{border-color:transparent;font-family:'IBM Plex Mono',monospace;color:#fff}
.chip.more{color:#9aa3b5}
.blk{display:inline-block;width:14px;height:7px;border-radius:2px;margin-left:2px}
.b-done{background:#2f9e5f}.b-todo{background:#4a5163}.b-dec{border:1px dashed #f5c542;height:5px;width:12px}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:7px;height:7px;border-radius:50%;display:block}
.menu{position:absolute;right:16px;top:52px;z-index:5;width:280px;background:#1e2333;border:1px solid #3d4457;border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:6px;display:flex;flex-direction:column}
.mi{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:0;background:transparent;color:#e8eaf0;padding:8px 10px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
.mi:hover{background:rgba(255,255,255,.07)}
.mi small{display:block;color:#9aa3b5;font-size:11.5px;margin-top:2px;line-height:1.35}
.sep{height:1px;background:#343a4c;margin:4px 2px}
.decide{margin-left:auto;height:28px;padding:0 12px;border-radius:5px;border:0;background:#f5c542;color:#2a2205;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid #2a3040}
.ghost{height:28px;padding:0 12px;border-radius:5px;border:1px solid #3d4457;background:transparent;color:#e8eaf0;font:inherit;font-size:12px;cursor:pointer}
.ghost:hover{border-color:#7c7ff0}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 1180px; padding: 24px 28px 40px; background: #161b26; color: #e8eaf0; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; position: relative">
<div style="max-width: 1210px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px">

<sc-for list="{{open}}" as="m" hint-placeholder-count="5">
<sc-if value="{{m.section}}" hint-placeholder-val="{{false}}"><h3 style="margin: 6px 0 -4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #8a93a6">{{m.section}}</h3></sc-if>
<section class="band {{m.warnCls}} {{m.dragCls}}" onDragOver="{{m.dragOver}}" onDrop="{{m.drop}}">
<div class="head">
<span class="grip" draggable="true" title="Drag to reorder" aria-label="Drag to reorder" onDragStart="{{m.dragStart}}" onDragEnd="{{m.dragEnd}}"><svg viewBox="0 0 16 16" width="12" height="16" fill="currentColor"><circle cx="5.5" cy="4" r="1.2"/><circle cx="10.5" cy="4" r="1.2"/><circle cx="5.5" cy="8" r="1.2"/><circle cx="10.5" cy="8" r="1.2"/><circle cx="5.5" cy="12" r="1.2"/><circle cx="10.5" cy="12" r="1.2"/></svg></span>
<button type="button" class="icbtn" aria-label="Expand"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M5.5 3.5 10 8l-4.5 4.5-1-1L8 8 4.5 4.5z"/></svg></button>
<button type="button" class="star {{m.starCls}}" aria-label="{{m.starLabel}}" aria-pressed="{{m.starPressed}}" onClick="{{m.toggleStar}}"><svg viewBox="0 0 16 16" width="16" height="16" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg></button>
<button type="button" class="play" aria-label="Play milestone"><svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg></button>
<div style="display: grid; gap: 4px; min-width: 0; flex: 1 1 320px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600; color: #f3f4f8">{{m.title}}</h2>
<sc-for list="{{m.tags}}" as="tg" hint-placeholder-count="2">
<span class="chip {{tg.cls}}" style="{{tg.style}}"><i style="background: {{tg.color}}"></i>{{tg.name}}</span>
</sc-for>
<sc-if value="{{m.more}}" hint-placeholder-val="{{false}}"><span class="chip more" title="{{m.moreTitle}}">{{m.more}}</span></sc-if>
</div>
<div style="font-size: 12px; color: #aab2c5"><b style="color: #e8eaf0; font-weight: 600">Ready to run</b> · {{m.sub}}</div>
</div>
<div style="display: grid; gap: 4px; width: 160px; flex: none">
<div style="height: 5px; border-radius: 3px; background: #3a4052; overflow: hidden"><i style="display: block; height: 100%; background: #2fbf71; width: {{m.pct}}"></i></div>
<span style="text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #aab2c5">{{m.done}}/{{m.total}} merged</span>
</div>
<button type="button" class="icbtn {{m.kebabCls}}" aria-label="Milestone actions" onClick="{{m.toggleMenu}}"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><circle cx="8" cy="3.5" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="12.5" r="1.4"/></svg></button>
<sc-if value="{{m.menuOpen}}" hint-placeholder-val="{{false}}">
<div class="menu" role="menu">
<button type="button" class="mi" role="menuitem" onClick="{{m.archive}}"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" style="flex: none; margin-top: 1px"><rect x="2" y="3" width="12" height="3" rx="1"/><path d="M3 6v6.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6M6.5 9h3"/></svg><span>Archive milestone<small>Closes it on GitHub and hides it from Plan. Issues are not touched.</small></span></button>
<button type="button" class="mi" role="menuitem"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" style="flex: none; margin-top: 1px"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg><span>Open on GitHub</span></button>
<button type="button" class="mi" role="menuitem"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" style="flex: none; margin-top: 1px"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h6"/></svg><span>Show issues in list</span></button>
</div>
</sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 10px 16px 10px 58px; font-size: 12px; color: #cfd5e2">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8fb0ff; display: inline-flex; align-items: center; gap: 8px">
<sc-for list="{{m.waves}}" as="w" hint-placeholder-count="2">
<sc-if value="{{w.arrow}}" hint-placeholder-val="{{false}}"><span style="color: #9aa3b5">→</span></sc-if>
<span>{{w.label}}<sc-for list="{{w.blocks}}" as="b" hint-placeholder-count="1"><span class="blk {{b}}"></span></sc-for></span>
</sc-for>
</span>
<sc-for list="{{m.legend}}" as="l" hint-placeholder-count="1">
<span class="lg"><i style="background: {{l.color}}"></i>{{l.text}}</span>
</sc-for>
<sc-if value="{{m.decide}}" hint-placeholder-val="{{false}}"><button type="button" class="decide">Decide {{m.decide}}</button></sc-if>
</div>
</section>
</sc-for>

<section style="border: 1px dashed #3d4457; border-radius: 10px; background: transparent">
<button type="button" onClick="{{toggleArchived}}" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px; border: 0; background: transparent; color: #aab2c5; font: inherit; font-size: 13px; cursor: pointer; text-align: left">
<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" style="transform: {{archRot}}"><path d="M5.5 3.5 10 8l-4.5 4.5-1-1L8 8 4.5 4.5z"/></svg>
<span style="font-weight: 600; color: #e8eaf0">Archived</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">{{archivedCount}}</span>
</button>
<sc-if value="{{showArchived}}" hint-placeholder-val="{{true}}">
<sc-for list="{{archived}}" as="a" hint-placeholder-count="2">
<div class="arow">
<span style="color: #cfd5e2; font-weight: 500">{{a.title}}</span>
<sc-for list="{{a.tags}}" as="tg" hint-placeholder-count="1">
<span class="chip {{tg.cls}}" style="{{tg.style}}"><i style="background: {{tg.color}}"></i>{{tg.name}}</span>
</sc-for>
<span style="color: #8a93a6; font-size: 12px">{{a.meta}}</span>
<span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9aa3b5">{{a.done}}/{{a.total}} merged</span>
<button type="button" class="ghost" onClick="{{a.restore}}">Restore</button>
</div>
</sc-for>
</sc-if>
</section>
</div>

<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 16px; background: #2a3042; border: 1px solid #3d4457; border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.5); font-size: 13px; color: #e8eaf0; max-width: calc(100% - 32px)">
<span>{{toast}}</span>
<button type="button" class="ghost" onClick="{{undo}}">Undo</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1180}}'>
var COLORS = { bug: '#d73a4a', enhancement: '#5fc8cf', design: '#9b87ff', 'tech-debt': '#e0703a', ui: '#e8a898', backend: '#4a9be0', infra: '#3fb36b' };
var PRI = { P0: '#b60205', P1: '#c2410c', P2: '#8a6d00', P3: '#16723a' };
var MAX_TAGS = 3;
var MILESTONES = [
  { id: 'm1', title: 'Fluke detecta errores de la app y propone issue en GitHub', sub: '3 waves, 4 issues', done: 0, total: 4, pri: 'P1', labels: ['enhancement', 'backend', 'ui', 'infra'],
    waves: [['b-done'], ['b-todo', 'b-todo'], ['b-todo']], legend: [{ color: '#8a93a6', text: '4 to do' }] },
  { id: 'm2', title: 'Issues agrupado por milestone por defecto', sub: '2 waves, 2 issues', done: 0, total: 2, labels: ['enhancement', 'ui'],
    waves: [['b-done'], ['b-todo']], legend: [{ color: '#8a93a6', text: '2 to do' }] },
  { id: 'm3', title: 'Volver de la vista de issue a la vista de milestone', sub: '1 wave, 1 issue', done: 0, total: 1, labels: ['bug', 'ui'],
    waves: [['b-done']], legend: [{ color: '#8a93a6', text: '1 to do' }] },
  { id: 'm4', title: 'Advanced settings como collapsable', sub: 'starts waiting for your decision on #651', done: 0, total: 1, pri: 'P3', labels: ['design', 'ui'], decide: '#651',
    waves: [['b-dec']], legend: [{ color: '#f5c542', text: '1 decision pending' }] },
  { id: 'm5', title: 'Brief: "Team needed" muestra el plantel total, no lo necesario', sub: 'starts waiting for your decision on #654', done: 0, total: 1, pri: 'P2', labels: ['bug'], decide: '#654',
    waves: [['b-dec']], legend: [{ color: '#f5c542', text: '1 decision pending' }] },
  { id: 'm6', title: 'Rediseño de tabs de brief del panel Fluke', sub: 'starts waiting for your decision on #647', done: 1, total: 3, labels: ['design', 'ui', 'tech-debt'], decide: '#647',
    waves: [['b-dec', 'b-done'], ['b-todo']], legend: [{ color: '#2fbf71', text: '1 merged' }, { color: '#f5c542', text: '1 decision pending' }, { color: '#8a93a6', text: '1 to do' }] },
  { id: 'a1', title: 'Quitar panel de phase templates', meta: 'archived 1 Oct', done: 2, total: 2, labels: ['tech-debt', 'ui'] },
  { id: 'a2', title: 'Enter para enviar en el chat', meta: 'archived 28 Sep · 1 issue still open', done: 1, total: 2, pri: 'P2', labels: ['enhancement'] }
];
function tagsOf(m) {
  var t = [];
  if (m.pri) t.push({ name: m.pri, cls: 'pri', color: 'transparent', style: 'background:' + PRI[m.pri] });
  m.labels.forEach(function (l) { t.push({ name: l, cls: '', color: COLORS[l] || '#8a93a6', style: '' }); });
  return t;
}
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { archived: ['a1', 'a2'], menu: 'm4', showArchived: true, toast: null, last: null,
    stars: ['m5'], order: MILESTONES.map(function (m) { return m.id; }), drag: null, over: null }; }
  move(from, to) {
    if (!from || from === to) return this.setState({ drag: null, over: null });
    var o = this.state.order.filter(function (x) { return x !== from; });
    o.splice(o.indexOf(to), 0, from);
    this.setState({ order: o, drag: null, over: null });
  }
  archive(id) {
    var m = MILESTONES.find(function (x) { return x.id === id; });
    var open = m.total - m.done;
    this.setState({ archived: [id].concat(this.state.archived), menu: null, last: id,
      toast: 'Milestone archived' + (open ? ' · ' + open + ' issue' + (open > 1 ? 's' : '') + ' still open on GitHub' : '') });
  }
  restore(id) { this.setState({ archived: this.state.archived.filter(function (x) { return x !== id; }), toast: null }); }
  renderVals() {
    var s = this.state, self = this;
    var isArch = function (m) { return s.archived.indexOf(m.id) >= 0; };
    var starred = function (m) { return s.stars.indexOf(m.id) >= 0; };
    var live = s.order.map(function (id) { return MILESTONES.find(function (m) { return m.id === id; }); }).filter(function (m) { return !isArch(m); });
    live = live.filter(starred).concat(live.filter(function (m) { return !starred(m); }));
    var open = live.map(function (m, i) {
      var tags = tagsOf(m);
      var st = starred(m);
      var section = i === 0 ? (st ? 'Starred' : 'Milestones') : (!st && starred(live[i - 1]) ? 'Milestones' : '');
      var shown = tags.slice(0, MAX_TAGS + (m.pri ? 1 : 0));
      var rest = tags.slice(shown.length);
      return {
        title: m.title, sub: m.sub, done: m.done, total: m.total, pct: (100 * m.done / m.total) + '%',
        tags: shown, more: rest.length ? '+' + rest.length : '', moreTitle: rest.map(function (r) { return r.name; }).join(', '),
        decide: m.decide || '', warnCls: m.decide ? 'warn' : '', legend: m.legend,
        waves: m.waves.map(function (b, i) { return { label: 'W' + i, arrow: i > 0, blocks: b }; }),
        menuOpen: s.menu === m.id, kebabCls: s.menu === m.id ? 'on' : '',
        toggleMenu: function () { self.setState({ menu: s.menu === m.id ? null : m.id }); },
        archive: function () { self.archive(m.id); },
        section: section, starCls: st ? 'on' : '', starLabel: st ? 'Unstar milestone' : 'Star milestone', starPressed: st ? 'true' : 'false',
        toggleStar: function () { self.setState({ stars: st ? s.stars.filter(function (x) { return x !== m.id; }) : s.stars.concat(m.id) }); },
        dragCls: (s.drag === m.id ? 'dragging ' : '') + (s.over === m.id && s.drag !== m.id ? 'over' : ''),
        dragStart: function (e) { if (e && e.dataTransfer) e.dataTransfer.setData('text/plain', m.id); self.setState({ drag: m.id }); },
        dragOver: function (e) { if (e) e.preventDefault(); if (s.over !== m.id) self.setState({ over: m.id }); },
        drop: function (e) { if (e) e.preventDefault(); self.move(s.drag, m.id); },
        dragEnd: function () { self.setState({ drag: null, over: null }); }
      };
    });
    var archived = s.archived.map(function (id) { return MILESTONES.find(function (m) { return m.id === id; }); }).map(function (m) {
      return { title: m.title, meta: m.meta || 'archived just now', done: m.done, total: m.total, tags: tagsOf(m),
        restore: function () { self.restore(m.id); } };
    });
    return {
      open: open, archived: archived, archivedCount: archived.length,
      showArchived: s.showArchived, archRot: s.showArchived ? 'rotate(90deg)' : 'none',
      toggleArchived: function () { self.setState({ showArchived: !s.showArchived }); },
      toast: s.toast, undo: function () { self.restore(s.last); }
    };
  }
}
</script>
</body>
</html>
