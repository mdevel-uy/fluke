[package]
name = "heartbeat-protocol"
version = "1.0.0"
edition = "2024"

# Tipos de la conexión de heartbeat entre una instancia de fluke y el control
# plane de mdevel (fase 5b). Crate puro y compartido por ambos lados para que el
# emisor y el receptor no puedan divergir. Sin lógica, sin IO.

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
