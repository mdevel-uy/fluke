[package]
name = "control-plane"
version = "1.0.0"
edition = "2024"

# Control plane de mdevel (fase 5b): recibe los heartbeats de las instancias de
# mkanban, los persiste, y (con la clave de firma online) responde con la
# licencia renovada. Deployable propio, en control.mkanban.dev.
#
# Dos superficies: `/v1/*` es ingesta máquina-a-máquina (instancias posteando,
# sin login humano); `/admin/*` (fase 2) va detrás de Auth0 con RBAC.

[[bin]]
name = "control-plane"
path = "src/main.rs"

[dependencies]
heartbeat-protocol = { path = "../heartbeat-protocol" }
licensing = { path = "../licensing" }
license-keystore = { path = "../license-keystore" }
ed25519-dalek = "2.2.0"
base64 = "0.22"
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "chrono"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = "0.5"
rand = "0.8"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
