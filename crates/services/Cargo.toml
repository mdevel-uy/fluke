[package]
name = "services"
version = "1.0.0"
edition = "2024"

[features]
default = []
cloud = []
qa-mode = ["executors/qa-mode"]

[dependencies]
indicatif = "0.17"
api-types = { path = "../api-types" }
relay-types = { path = "../relay-types" }
utils = { path = "../utils" }
git = { path = "../git" }
licensing = { path = "../licensing" }
ed25519-dalek = "2.2.0"
base64 = "0.22"
git-host = { path = "../git-host" }
executors = { path = "../executors" }
db = { path = "../db" }
heartbeat-protocol = { path = "../heartbeat-protocol" }
worktree-manager = { path = "../worktree-manager" }
workspace-manager = { path = "../workspace-manager" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = "2.5"
anyhow = { workspace = true }
tracing = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "sqlite-preupdate-hook", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
ts-rs = { workspace = true }
dirs = "5.0"
async-trait = { workspace = true }
rust-embed = "8.2"
ignore = "0.4"
notify-rust = "4.11"
os_info = "3.12.0"
reqwest = { workspace = true }
json-patch = "2.0"
backon = "1.5.1"
thiserror = { workspace = true }
futures = "0.3.31"
tokio-stream = "0.1.17"
strum = "0.27.2"
strum_macros = "0.27.2"
notify = "8.2.0"
notify-debouncer-full = "0.5.0"
dunce = "1.0"
dashmap = "6.1"
once_cell = "1.20"
sha2 = "0.10"
fst = "0.4"
moka = { version = "0.12", features = ["future"] }
mime_guess = "2.0"
p256 = { version = "0.13", features = ["pem", "pkcs8"] }

# web-push → ece requires OpenSSL on every target, which breaks the desktop
# builds (Windows/macOS cross-compile). Web Push only matters for the Linux
# server (VPS/docker); the desktop app has native notifications instead.
[target.'cfg(target_os = "linux")'.dependencies]
web-push = { version = "0.10", default-features = false, features = ["hyper-client"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
rand = "0.8"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
