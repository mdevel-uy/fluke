[package]
name = "license-keystore"
version = "1.0.0"
edition = "2024"

# Cifrado en reposo de la clave PRIVADA de firma (scrypt + AES-256-GCM).
# Compartido por `fluke-license` (emisión manual) y el control plane
# (renovación online). NO lo usa el crate `licensing`, que va embebido en el
# cliente y solo verifica — el cliente no debe cargar cripto de cifrado.

[dependencies]
ed25519-dalek = "2.2.0"
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rand = "0.8"

[dev-dependencies]
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
